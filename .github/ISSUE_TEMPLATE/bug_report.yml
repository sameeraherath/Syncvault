name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Do not file it here — see docs/SECURITY.md.
        **Never paste passwords, recovery keys, tokens or your rclone.conf.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Were files lost, deleted or overwritten?
      options: ['No', 'Yes — please prioritise', 'Not sure']
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Syncvault version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and desktop environment
      placeholder: Ubuntu 24.04, GNOME 46 (Wayland)
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Cloud provider(s)
      placeholder: Google Drive, OneDrive
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove file names and paths you don't want to share.
      render: text
